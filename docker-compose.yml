services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartstok
    ports: ["3306:3306"]
    volumes: ["smartstok_db:/var/lib/mysql"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/smartstok
      JWT_SECRET: change-this-secret
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  smartstok_db:
